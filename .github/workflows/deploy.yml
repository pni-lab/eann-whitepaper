name: Build PDF and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Serve the site from https://<user>.github.io/<repo>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MyST
        run: npm install -g mystmd

      - name: Install LaTeX (XeLaTeX + packages used by the arXiv template)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-science lmodern latexmk

      - name: Cache MyST downloads (DOI metadata, templates)
        uses: actions/cache@v4
        with:
          path: _build/cache
          key: myst-cache-${{ hashFiles('whitepaper.md', 'references.bib') }}
          restore-keys: myst-cache-

      - name: Build PDF (arXiv style, one column)
        run: |
          myst build --pdf
          if [ ! -f exports/whitepaper.pdf ]; then
            echo "::error::MyST did not produce exports/whitepaper.pdf. Diagnostics follow."
            echo "--- LaTeX log (last 80 lines) ---"
            tail -n 80 _build/temp/*/whitepaper.log 2>/dev/null || echo "(no LaTeX log: the export failed before LaTeX ran, see the MyST output above)"
            exit 1
          fi

      - name: Build website
        run: myst build --html

      - name: Add the PDF to the website
        run: cp exports/whitepaper.pdf _build/html/whitepaper.pdf

      - name: Keep the PDF as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: exports/whitepaper.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
